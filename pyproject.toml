[project]
name = "skanevux-mcp"
version = "0.1.0"
description = "MCP server exposing job-prospect data from skanevux.se"
authors = [
    { name = "zilaei", email = "zzilaei@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "markdownify>=0.14.1",
    "mcp[cli]>=1.27.0",
    "pydantic-settings>=2.14.0",
    "uvicorn>=0.44.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "respx>=0.22.0",
    "ruff>=0.15.11",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
